<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#013878">
    <title>UNI PLUS | لوحة التحكم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* ألوان UNI PLUS الأصلية */
            --primary: #013878;
            --primary-dark: #002a5c;
            --primary-light: #0a4a96;
            --gold: #C9A227;
            --gold-light: #E8C766;
            --gold-dark: #a88520;

            --black: #0A0A0A;
            --surface-main: #FFFFFF;
            --surface-soft: #F5F8FC;
            --surface-card: #FFFFFF;
            --heading-color: #013878;
            --body-color: #4a5a6a;
            --muted-color: #6b7a8a;
            --border-color: #d0dae8;
            --blue-gradient: linear-gradient(135deg, #013878, #0a4a96);
            --gold-gradient: linear-gradient(135deg, #C9A227, #E8C766);
            --shadow-sm: 0 2px 8px rgba(1,56,120,0.06);
            --shadow-md: 0 8px 24px rgba(1,56,120,0.10);
            --shadow-lg: 0 12px 32px rgba(1,56,120,0.20);
            --shadow-gold: 0 8px 28px rgba(201,162,39,0.35);
            --font: 'Cairo', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); }
        
        body { 
            background-color: var(--surface-soft); 
            color: var(--body-color); 
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        #dashboard { display: flex; min-height: 100vh; position: relative; }

        /* =========================================
           Sidebar — أزرق ملكي مع تفاصيل ذهبية
           ========================================= */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #013878 0%, #002a5c 100%);
            color: #FFF;
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            border-left: 1px solid rgba(255,255,255,0.05);
            position: fixed;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 100% 0%, rgba(201,162,39,0.15) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(201,162,39,0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .sidebar-header {
            padding: 30px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 2;
        }

        .sidebar-header h2 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #FFF;
        }

        .sidebar-header h2 span { color: var(--gold-light); }
        
        .sidebar-header p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
            font-weight: 500;
        }

        .sidebar-nav {
            padding: 20px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            z-index: 2;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            color: rgba(255,255,255,0.65);
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
            cursor: pointer;
        }

        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.08);
            color: #FFF;
        }

        .sidebar-nav a.active {
            background: var(--gold-gradient);
            color: var(--primary-dark);
            box-shadow: var(--shadow-gold);
            font-weight: 800;
        }

        .sidebar-nav a.active svg { stroke: var(--primary-dark); }

        /* =========================================
           Main Content
           ========================================= */
        .main-content {
            flex: 1;
            margin-right: 280px;
            padding: 40px;
            transition: var(--transition);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-bar h1 {
            color: var(--heading-color);
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .top-bar .btn-view {
            padding: 10px 20px;
            background: var(--primary);
            color: #FFF;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            box-shadow: var(--shadow-md);
        }
        .top-bar .btn-view:hover { 
            background: var(--gold);
            color: var(--primary);
            transform: translateY(-2px);
        }

        /* =========================================
           Cards
           ========================================= */
        .card {
            background: var(--surface-card);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            animation: slideUp 0.4s ease forwards;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 4px;
            background: var(--gold-gradient);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-header h3 {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--heading-color);
        }

        .card-header .count-badge {
            background: rgba(201,162,39,0.15);
            color: var(--gold-dark);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 800;
            border: 1px solid rgba(201,162,39,0.3);
        }

        /* =========================================
           Forms
           ========================================= */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
        }
        @media (min-width: 700px) {
            .form-grid { grid-template-columns: 1fr 1fr; gap: 0 20px; }
            .form-group.full { grid-column: 1 / -1; }
        }

        .form-group { margin-bottom: 24px; }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--heading-color);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--heading-color);
            background: var(--surface-soft);
            transition: var(--transition);
            outline: none;
        }

        .form-control::placeholder { color: #9aabbd; }

        .form-control:focus {
            border-color: var(--primary);
            background: #FFF;
            box-shadow: 0 0 0 4px rgba(1,56,120,0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
            line-height: 1.7;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: var(--surface-soft);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        .checkbox-row:hover { border-color: var(--gold); }
        .checkbox-row input { 
            width: 20px; height: 20px; 
            accent-color: var(--primary); 
            cursor: pointer; 
        }
        .checkbox-row label { margin: 0; cursor: pointer; font-weight: 700; color: var(--heading-color); }

        /* =========================================
           Image Upload
           ========================================= */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--surface-soft);
            position: relative;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--gold);
            background: rgba(201,162,39,0.04);
        }

        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: block;
        }

        .upload-text {
            font-weight: 700;
            color: var(--heading-color);
            margin-bottom: 4px;
        }

        .upload-subtext {
            font-size: 0.82rem;
            color: var(--muted-color);
        }

        /* =========================================
           Image Preview
           ========================================= */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .preview-item img { width: 100%; height: 100%; object-fit: cover; }

        .preview-remove {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(1,56,120,0.85);
            color: #FFF;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            transition: var(--transition);
        }

        .preview-remove:hover {
            background: var(--gold);
            color: var(--primary);
            transform: scale(1.1);
        }

        /* =========================================
           Buttons
           ========================================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            outline: none;
        }

        .btn-primary {
            background: var(--blue-gradient);
            color: #FFF;
            box-shadow: var(--shadow-md);
            width: 100%;
        }

        .btn-primary:hover { 
            background: var(--gold-gradient);
            color: var(--primary-dark);
            transform: translateY(-2px); 
            box-shadow: var(--shadow-gold);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .btn-secondary {
            background: var(--surface-soft);
            color: var(--heading-color);
            border: 2px solid var(--border-color);
        }
        .btn-secondary:hover { 
            border-color: var(--primary); 
            color: var(--primary); 
        }

        .form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        @media (max-width: 600px) {
            .form-actions { flex-direction: column; }
            .form-actions .btn { width: 100%; }
        }

        /* =========================================
           Table
           ========================================= */
        .table-responsive {
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        table { width: 100%; border-collapse: collapse; white-space: nowrap; }

        th {
            background: var(--surface-soft);
            padding: 16px;
            text-align: right;
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--heading-color);
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            font-size: 0.9rem;
            color: var(--body-color);
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(1,56,120,0.02); }

        .table-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 800;
        }
        .badge-active { background: #D1FAE5; color: #059669; }
        .badge-inactive { background: #FEE2E2; color: #DC2626; }
        .badge-gold { 
            background: rgba(201,162,39,0.15); 
            color: var(--gold-dark); 
            border: 1px solid rgba(201,162,39,0.3);
        }

        .action-btns { display: flex; gap: 6px; }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: var(--transition);
        }

        .btn-edit { background: rgba(1,56,120,0.1); color: var(--primary); }
        .btn-edit:hover { background: var(--primary); color: #FFF; }

        .btn-delete { background: #FEE2E2; color: #DC2626; }
        .btn-delete:hover { background: #DC2626; color: #FFF; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted-color);
        }
        .empty-state .icon-big { font-size: 3rem; margin-bottom: 12px; }
        .empty-state h4 { 
            color: var(--heading-color); 
            margin-bottom: 6px; 
            font-size: 1.1rem; 
        }

        /* =========================================
           Toast
           ========================================= */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--primary);
            color: #FFF;
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 700;
            box-shadow: 0 20px 40px rgba(1,56,120,0.3);
            opacity: 0;
            transition: var(--transition);
            z-index: 9999;
        }

        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        #toast.error { background: #DC2626; }
        #toast.success { 
            background: var(--gold-gradient); 
            color: var(--primary-dark); 
        }

        /* =========================================
           Mobile
           ========================================= */
        .mobile-header {
            display: none;
            background: var(--blue-gradient);
            color: #FFF;
            padding: 16px 20px;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .mobile-header h2 { font-family: var(--font-display); font-size: 1.2rem; }
        .mobile-header span { color: var(--gold-light); }

        .mobile-toggle {
            background: transparent;
            border: none;
            color: #FFF;
            cursor: pointer;
            padding: 8px;
        }

        @media (max-width: 900px) {
            .mobile-header { display: flex; }
            
            .sidebar {
                transform: translateX(100%);
                width: 100%;
                max-width: 300px;
                box-shadow: -10px 0 30px rgba(1,56,120,0.4);
            }
            .sidebar.open { transform: translateX(0); }

            .main-content { margin-right: 0; padding: 20px 16px; }
            .top-bar h1 { font-size: 1.4rem; }
            .card { padding: 20px; }

            .table-responsive { border: none; overflow: visible; }
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }

            tr {
                background: var(--surface-card);
                border: 1px solid var(--border-color);
                border-radius: var(--radius-sm);
                margin-bottom: 16px;
                padding: 16px;
                box-shadow: var(--shadow-sm);
            }

            td {
                border: none;
                position: relative;
                padding: 8px 0;
                padding-right: 45%;
                text-align: right;
                white-space: normal;
                min-height: 32px;
            }

            td:before {
                position: absolute;
                top: 8px;
                right: 0;
                width: 42%;
                white-space: nowrap;
                font-weight: 700;
                color: var(--heading-color);
                content: attr(data-label);
            }

            td:first-child { padding-right: 0; text-align: center; padding-bottom: 16px; }
            td:first-child:before { display: none; }
            
            .table-img { width: 100%; height: 160px; border-radius: var(--radius-sm); }

            .action-btns { justify-content: flex-end; width: 100%; }
        }

        /* =========================================
           Loading spinner
           ========================================= */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #FFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Mobile header -->
    <div class="mobile-header">
        <h2>UNI <span>PLUS</span></h2>
        <button class="mobile-toggle" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
    </div>

    <div id="dashboard">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>UNI <span>PLUS</span></h2>
                <p>لوحة التحكم — الباقات والعروض</p>
            </div>
            <div class="sidebar-nav">
                <a class="active" onclick="switchTab('add-package', this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    إضافة باقة
                </a>
                <a onclick="switchTab('manage-packages', this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                    إدارة الباقات
                </a>
                <a href="index.html" target="_blank" style="margin-top: auto; border: 1px solid rgba(255,255,255,0.12);">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    عرض الموقع
                </a>
            </div>
        </div>

        <!-- Main content -->
        <div class="main-content">
            <div class="top-bar">
                <h1 id="pageTitle">إضافة باقة جديدة</h1>
                <a href="index.html" target="_blank" class="btn-view">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                    معاينة الموقع
                </a>
            </div>

            <!-- ============ TAB: ADD PACKAGE ============ -->
            <div id="tab-add-package" class="tab-content active">
                <div class="card">
                    <form id="packageForm" onsubmit="savePackage(event)">
                        <input type="hidden" id="packageId">

                        <div class="form-grid">
                            <!-- العنوان -->
                            <div class="form-group full">
                                <label>عنوان الباقة *</label>
                                <input type="text" id="title" class="form-control" required placeholder="مثال: باقة إسطنبول الصيفية">
                            </div>

                            <!-- الوجهة + المدة -->
                            <div class="form-group">
                                <label>الوجهة</label>
                                <input type="text" id="destination" class="form-control" placeholder="مثال: إسطنبول، تركيا">
                            </div>
                            <div class="form-group">
                                <label>المدة</label>
                                <input type="text" id="duration" class="form-control" placeholder="مثال: 7 ليالٍ / 8 أيام">
                            </div>

                            <!-- السعر + العملة -->
                            <div class="form-group">
                                <label>السعر</label>
                                <input type="number" id="price" class="form-control" step="0.01" min="0" placeholder="0">
                            </div>
                            <div class="form-group">
                                <label>العملة</label>
                                <input type="text" id="currency" class="form-control" value="LYD" placeholder="LYD">
                            </div>

                            <!-- الشارة + الترتيب -->
                            <div class="form-group">
                                <label>الشارة (Badge)</label>
                                <input type="text" id="badge" class="form-control" placeholder="مثال: الأكثر مبيعاً">
                            </div>
                            <div class="form-group">
                                <label>ترتيب العرض</label>
                                <input type="number" id="sort_order" class="form-control" value="0" min="0">
                            </div>

                            <!-- الوصف -->
                            <div class="form-group full">
                                <label>وصف الباقة</label>
                                <textarea id="description" class="form-control" placeholder="وصف مختصر وجذاب للباقة..."></textarea>
                            </div>

                            <!-- المميزات -->
                            <div class="form-group full">
                                <label>المميزات (سطر لكل ميزة)</label>
                                <textarea id="features" class="form-control" style="min-height:110px" placeholder="تذاكر طيران&#10;فندق 4 نجوم&#10;استقبال بالمطار&#10;جولات سياحية"></textarea>
                            </div>

                            <!-- رفع الصورة -->
                            <div class="form-group full">
                                <label>صورة الباقة</label>
                                <div class="upload-area" id="uploadArea">
                                    <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
                                    <span class="upload-icon">📸</span>
                                    <div class="upload-text">اضغط هنا أو اسحب الصورة</div>
                                    <div class="upload-subtext">يدعم JPG, PNG, WEBP — أو الصق رابط الصورة أدناه</div>
                                </div>
                                <input type="url" id="image_url" class="form-control" placeholder="أو الصق رابط صورة مباشر هنا..." style="margin-top: 12px;">
                                <div class="preview-grid" id="imagePreviewContainer"></div>
                            </div>

                            <!-- الحالة -->
                            <div class="form-group full">
                                <div class="checkbox-row" onclick="document.getElementById('is_active').click()">
                                    <input type="checkbox" id="is_active" checked onclick="event.stopPropagation()">
                                    <label for="is_active">نشط — يظهر على الموقع</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                                حفظ الباقة
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="resetForm()">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                                إفراغ
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- ============ TAB: MANAGE PACKAGES ============ -->
            <div id="tab-manage-packages" class="tab-content" style="display:none;">
                <div class="card">
                    <div class="card-header">
                        <h3>جميع الباقات</h3>
                        <span class="count-badge" id="countBadge">0</span>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>الصورة</th>
                                    <th>العنوان</th>
                                    <th>الوجهة</th>
                                    <th>السعر</th>
                                    <th>الحالة</th>
                                    <th>الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="packagesTableBody">
                                <tr><td colspan="6" style="text-align:center; padding: 40px;">جاري التحميل...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">تمت العملية بنجاح</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================
        // Supabase Configuration
        // ============================================
        const SUPABASE_URL = 'https://mmqbwmnvcpblateekoed.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_2kGdSLEcZLKBFjjolUo3Lg_4D-gR7fY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const STORAGE_BUCKET = 'packages';

        let selectedFile = null;
        let existingImageUrl = '';

        document.addEventListener('DOMContentLoaded', () => {
            loadPackages();
            initDragAndDrop();
        });

        // ============================================
        // Tab switching
        // ============================================
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).style.display = 'block';
            if(element) element.classList.add('active');
            
            if (tabId === 'add-package') {
                document.getElementById('pageTitle').innerText = 'إضافة باقة جديدة';
                resetForm();
            } else if (tabId === 'manage-packages') {
                document.getElementById('pageTitle').innerText = 'إدارة الباقات';
                loadPackages();
            }

            if (window.innerWidth <= 900) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // ============================================
        // Image Upload
        // ============================================
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file || !file.type.startsWith('image/')) return;
            selectedFile = file;
            renderPreview(URL.createObjectURL(file));
            event.target.value = '';
        }

        function initDragAndDrop() {
            const uploadArea = document.getElementById('uploadArea');
            if (!uploadArea) return;

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
                uploadArea.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
            });
            ['dragenter', 'dragover'].forEach(evt => {
                uploadArea.addEventListener(evt, () => uploadArea.classList.add('dragover'));
            });
            ['dragleave', 'drop'].forEach(evt => {
                uploadArea.addEventListener(evt, () => uploadArea.classList.remove('dragover'));
            });
            uploadArea.addEventListener('drop', (e) => {
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    selectedFile = file;
                    renderPreview(URL.createObjectURL(file));
                }
            });
        }

        function renderPreview(src) {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = `
                <div class="preview-item">
                    <img src="${src}" alt="preview">
                    <button type="button" class="preview-remove" onclick="removeImage()">×</button>
                </div>
            `;
        }

        function removeImage() {
            selectedFile = null;
            existingImageUrl = '';
            document.getElementById('imagePreviewContainer').innerHTML = '';
            document.getElementById('image_url').value = '';
        }

        // ============================================
        // CRUD
        // ============================================
        async function savePackage(e) {
            e.preventDefault();
            const id = document.getElementById('packageId').value;
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;

            btn.innerHTML = 'جاري الحفظ... <span class="loading-spinner"></span>';
            btn.disabled = true;

            try {
                let imageUrl = document.getElementById('image_url').value.trim() || existingImageUrl;

                if (selectedFile) {
                    const fileExt = selectedFile.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

                    const { error: uploadError } = await supabaseClient.storage
                        .from(STORAGE_BUCKET)
                        .upload(fileName, selectedFile, { upsert: false });

                    if (uploadError) {
                        if (!imageUrl) throw new Error('فشل رفع الصورة: ' + uploadError.message + ' — يمكنك لصق رابط صورة مباشر بدلاً من ذلك');
                    } else {
                        const { data: urlData } = supabaseClient.storage
                            .from(STORAGE_BUCKET)
                            .getPublicUrl(fileName);
                        imageUrl = urlData.publicUrl;
                    }
                }

                const featuresText = document.getElementById('features').value.trim();
                const features = featuresText ? featuresText.split('\n').map(l => l.trim()).filter(Boolean) : [];

                const packageData = {
                    title: document.getElementById('title').value.trim(),
                    description: document.getElementById('description').value.trim() || null,
                    price: document.getElementById('price').value ? Number(document.getElementById('price').value) : null,
                    currency: document.getElementById('currency').value.trim() || 'LYD',
                    image_url: imageUrl || null,
                    destination: document.getElementById('destination').value.trim() || null,
                    duration: document.getElementById('duration').value.trim() || null,
                    features: features,
                    badge: document.getElementById('badge').value.trim() || null,
                    is_active: document.getElementById('is_active').checked,
                    sort_order: Number(document.getElementById('sort_order').value) || 0
                };

                if (!packageData.title) throw new Error('العنوان مطلوب');

                let error;
                if (id) {
                    const res = await supabaseClient.from('packages').update(packageData).eq('id', id);
                    error = res.error;
                } else {
                    const res = await supabaseClient.from('packages').insert([packageData]);
                    error = res.error;
                }

                if (error) throw error;

                showToast(id ? '✅ تم تحديث الباقة بنجاح' : '✅ تمت إضافة الباقة بنجاح', 'success');
                resetForm();
                document.querySelectorAll('.sidebar-nav a')[1].click();

            } catch (err) {
                console.error(err);
                showToast('❌ ' + err.message, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function loadPackages() {
            const tbody = document.getElementById('packagesTableBody');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 40px;">جاري التحميل...</td></tr>';

            const { data, error } = await supabaseClient
                .from('packages')
                .select('*')
                .order('sort_order', { ascending: true })
                .order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" style="color:red; text-align:center; padding:40px;">خطأ: ${error.message}</td></tr>`;
                return;
            }

            document.getElementById('countBadge').innerText = data.length;

            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="6">
                        <div class="empty-state">
                            <div class="icon-big">📦</div>
                            <h4>لا توجد باقات بعد</h4>
                            <p>أضف أول باقة من نموذج "إضافة باقة"</p>
                        </div>
                    </td></tr>
                `;
                return;
            }

            const defaultImg = 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?q=80&w=100';

            tbody.innerHTML = data.map(pkg => {
                const img = pkg.image_url || defaultImg;
                const price = pkg.price ? `${Number(pkg.price).toLocaleString('en-US')} ${pkg.currency || 'LYD'}` : '—';

                return `
                <tr>
                    <td data-label="الصورة">
                        <img src="${escapeHtml(img)}" class="table-img" alt="" onerror="this.src='${defaultImg}'">
                    </td>
                    <td data-label="العنوان" style="font-weight:700; color:var(--heading-color); white-space:normal; max-width:220px;">
                        ${escapeHtml(pkg.title)}
                        ${pkg.badge ? `<br><span class="badge badge-gold" style="margin-top:4px;">${escapeHtml(pkg.badge)}</span>` : ''}
                    </td>
                    <td data-label="الوجهة">${escapeHtml(pkg.destination || '—')}</td>
                    <td data-label="السعر" style="font-weight:700;">${price}</td>
                    <td data-label="الحالة">
                        ${pkg.is_active
                            ? '<span class="badge badge-active">✓ نشط</span>'
                            : '<span class="badge badge-inactive">✗ غير نشط</span>'}
                    </td>
                    <td data-label="الإجراءات">
                        <div class="action-btns">
                            <button class="btn-icon btn-edit" onclick="editPackage(${pkg.id})" title="تعديل">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </button>
                            <button class="btn-icon btn-delete" onclick="deletePackage(${pkg.id})" title="حذف">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `}).join('');
        }

        async function editPackage(id) {
            const { data, error } = await supabaseClient.from('packages').select('*').eq('id', id).single();
            if (error) return showToast('خطأ في جلب الباقة', 'error');

            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById('tab-add-package').style.display = 'block';
            document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
            document.querySelectorAll('.sidebar-nav a')[0].classList.add('active');
            document.getElementById('pageTitle').innerText = 'تعديل الباقة';

            document.getElementById('packageId').value = data.id;
            document.getElementById('title').value = data.title || '';
            document.getElementById('description').value = data.description || '';
            document.getElementById('price').value = data.price || '';
            document.getElementById('currency').value = data.currency || 'LYD';
            document.getElementById('destination').value = data.destination || '';
            document.getElementById('duration').value = data.duration || '';
            document.getElementById('badge').value = data.badge || '';
            document.getElementById('features').value = Array.isArray(data.features) ? data.features.join('\n') : '';
            document.getElementById('is_active').checked = data.is_active !== false;
            document.getElementById('sort_order').value = data.sort_order || 0;
            document.getElementById('image_url').value = data.image_url || '';
            document.getElementById('submitBtn').innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                حفظ التعديلات
            `;

            selectedFile = null;
            existingImageUrl = data.image_url || '';

            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = '';
            if (data.image_url) {
                container.innerHTML = `
                    <div class="preview-item">
                        <img src="${escapeHtml(data.image_url)}" alt="preview" onerror="this.parentElement.remove()">
                        <button type="button" class="preview-remove" onclick="removeImage()">×</button>
                    </div>
                `;
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deletePackage(id) {
            if (!confirm('هل أنت متأكد من حذف هذه الباقة نهائياً؟')) return;
            
            const { error } = await supabaseClient.from('packages').delete().eq('id', id);
            if (error) {
                showToast('خطأ: ' + error.message, 'error');
            } else {
                showToast('✅ تم حذف الباقة', 'success');
                loadPackages();
            }
        }

        function resetForm() {
            document.getElementById('packageForm').reset();
            document.getElementById('packageId').value = '';
            document.getElementById('imagePreviewContainer').innerHTML = '';
            document.getElementById('currency').value = 'LYD';
            document.getElementById('sort_order').value = '0';
            document.getElementById('is_active').checked = true;
            document.getElementById('submitBtn').innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                حفظ الباقة
            `;
            selectedFile = null;
            existingImageUrl = '';
        }

        // ============================================
        // Utilities
        // ============================================
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = 'show ' + type;
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function escapeHtml(s) {
            if (s == null) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
